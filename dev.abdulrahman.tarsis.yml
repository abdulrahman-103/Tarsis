id: dev.abdulrahman.tarsis
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: tarsis
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - name: tarsis
    buildsystem: simple
    build-commands:
      - gcc -Os -flto main.c -o tarsis -Wl,--gc-sections -s -Lraylib -lraylib -lGL -lm -lpthread -ldl -lrt -lX11
      - install -Dm755 tarsis /app/bin/tarsis
      - install -Dm644 dev.abdulrahman.tarsis.desktop /app/share/applications/dev.abdulrahman.tarsis.desktop
      - install -Dm644 dev.abdulrahman.tarsis.png /app/share/icons/hicolor/512x512/apps/dev.abdulrahman.tarsis.png
    sources:
      - type: git
        url: https://github.com/abdulrahman-103/Tarsis.git
